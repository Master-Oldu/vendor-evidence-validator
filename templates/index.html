<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vendor Evidence Validator</title>
</head>
<body>
    <h1>Vendor Evidence Validator</h1>
    <p>Upload a questionnaire and supporting evidence for validation.</p>

    <form method="POST" enctype="multipart/form-data">

        <label>Questionnaire</label><br>
        <input
            type="file"
            name="questionnaire"
            accept=".xlsx,.csv"
            required
        >
        <br><br>
    
        <label>Supporting Evidence</label><br>
        <input
            type="file"
            name="evidence"
            accept=".pdf,.docx,.xlsx,.csv,.txt"
            multiple
        >
    
        <br><br>
    
        <button type="submit">Upload Files</button>
    
    </form>
</body>
</html>
